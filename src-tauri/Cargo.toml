[package]
name = "nghenhacpromax-tauri"
version = "2.0.0"
description = "Nghe Nhac Pro Max - Tauri 2 Local Music Player"
edition = "2021"

[lib]
name = "nghenhacpromax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri Framework
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }

# Serialization & Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Local Storage / Database
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid", "backup"] }

# Audio Metadata & Tag Extraction / Editing
lofty = "0.21"

# Filesystem Watching & Scanning
notify = "6.1"
walkdir = "2.5"

# Audio Engine / Playback dependencies
# FFmpeg decode (vendored shared libs under vendor/ffmpeg — see build.rs)
ffmpeg-next = { version = "9.0", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
] }
cpal = "0.15"
ringbuf = "0.4"

# Search & Utilities
fuzzy-matcher = "0.3"
rand = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
directories = "5.0"
regex = "1.10"
sha2 = "0.10"
base64 = "0.22"
unicode-normalization = "0.1"
crossbeam-channel = "0.5"
rayon = "1.10"
rfd = "0.15"
discord-rich-presence = "0.2"

# Image processing for cover art cache
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Async runtime & Logging (only the features actually used:
# interval ticker, broadcast channel, spawn_blocking)
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"

# Keep decoding and DSP fast enough for realtime playback during `tauri dev`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

# WASAPI Exclusive output (Windows only). Features also documented in src/audio/wasapi/mod.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_LibraryLoader",
] }
