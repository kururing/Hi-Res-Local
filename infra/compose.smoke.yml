name: nghenhac-smoke

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nghenhac
      POSTGRES_PASSWORD: nghenhac
      POSTGRES_DB: nghenhac
    ports:
      - "5434:5432"
    volumes:
      - nghenhac_smoke_pgdata:/var/lib/postgresql/data
    networks:
      - smoke
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nghenhac -d nghenhac"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
    volumes:
      - nghenhac_smoke_minio:/data
    networks:
      - smoke
  storage-init:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: nghenhac-server:smoke
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://nghenhac:nghenhac@postgres:5432/nghenhac
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9010
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CORS_ORIGINS: http://127.0.0.1:8080
      JWT_SECRET: smoke-jwt-secret-value-32-chars-min
    command: ["node", "dist/cli/ensureStorage.js"]
    networks:
      - smoke
    restart: "no"

  api:
    image: nghenhac-server:smoke
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      MEDIA_PROBE_MODE: nnpm
      DATABASE_URL: postgres://nghenhac:nghenhac@postgres:5432/nghenhac
      JWT_SECRET: smoke-jwt-secret-value-32-chars-min
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: http://127.0.0.1:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9010
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9010/nghenhacpromax-artwork
      WORKER_TEMP_DIR: /tmp/nghenhac-ingest
      METRICS_ENABLED: "false"
    command: ["node", "dist/server.js"]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smoke
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    image: nghenhac-server:smoke
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MEDIA_PROBE_MODE: nnpm
      DATABASE_URL: postgres://nghenhac:nghenhac@postgres:5432/nghenhac
      JWT_SECRET: smoke-jwt-secret-value-32-chars-min
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9010
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:9010/nghenhacpromax-artwork
      WORKER_TEMP_DIR: /tmp/nghenhac-ingest
      WORKER_HEARTBEAT_PATH: /tmp/nghenhac-ingest/heartbeat
      CORS_ORIGINS: http://127.0.0.1:8080
    command: ["node", "dist/worker.js"]
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - smoke
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs'); const p=process.env.WORKER_HEARTBEAT_PATH||'/tmp/nghenhac-ingest/heartbeat'; fs.accessSync(p); process.exit(Date.now()-fs.statSync(p).mtimeMs<120000?0:1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    image: nghenhac-server:smoke
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nghenhac:nghenhac@postgres:5432/nghenhac
      JWT_SECRET: smoke-jwt-secret-value-32-chars-min
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CORS_ORIGINS: http://127.0.0.1:8080
    command: ["node", "dist/cli/migrate.js"]
    networks:
      - smoke
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_APP_RUNTIME: web
        VITE_CLOUD_API_URL: /api
    image: nghenhac-web:smoke
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:3001
      ARTWORK_ORIGIN: http://127.0.0.1:9010
      MEDIA_ORIGIN: http://127.0.0.1:9010
    ports:
      - "8080:8080"
    networks:
      - smoke

networks:
  smoke:
    name: nghenhac_smoke_net

volumes:
  nghenhac_smoke_pgdata:
    name: nghenhac_smoke_pgdata
  nghenhac_smoke_minio:
    name: nghenhac_smoke_minio
