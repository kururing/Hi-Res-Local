[package]
name = "nghenhacpromax"
version = "0.1.0"
edition = "2021"
description = "Native desktop music player built with Iced and Rust"
build = "build.rs"

[dependencies]
# UI Framework
iced = { version = "0.13", features = ["tokio", "svg", "image", "advanced"] }

# Audio Playback & Decoding
rodio = "0.20"
symphonia = { version = "0.5", features = ["all"] }

# Metadata & Tag Extraction
lofty = "0.21"

# Local Storage / Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Native File Dialogs
rfd = "0.15"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# Filesystem & Directories
directories = "5.0"
walkdir = "2.5"

# Concurrency & Async
tokio = { version = "1.40", features = ["full"] }

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
image = "0.24"

[build-dependencies]
winresource = "0.1.31"
