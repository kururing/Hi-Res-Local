[package]
name = "nnpm-audio-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shared probe, decode, DSD, MQA detect, and DSP graph for Nghe Nhạc Pro Max"

[lib]
name = "nnpm_audio_core"
crate-type = ["rlib", "cdylib"]

[features]
default = ["pcm", "dsd", "dst-rust", "mqa", "ndsd"]
pcm = []
dsd = []
dst-rust = ["dep:dst-decoder"]
dst-native = ["dep:ndsd-read", "ndsd-read/dstdec"]
mqa = ["dep:mqa-identify"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
ndsd = ["dst-native"]

[dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"

symphonia = { version = "0.5", features = ["all"] }
lofty = "0.21"
rubato = "0.16"
ogg = "0.8"
moosicbox_opus = "0.4.0"

dst-decoder = { version = "0.1.2", optional = true }
mqa-identify = { version = "0.3", default-features = false, optional = true }

wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndsd-read = { version = "0.1.2", optional = true, default-features = false }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
tempfile = "3.10"
